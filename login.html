<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/hermes.png?v=2">
<link rel="apple-touch-icon" href="/hermes.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Atlas · Anmelden</title>
<style>
  :root { --bg:#050505; --fg:#e6e6e6; --dim:#8a8a8a; --rand:#2b2b2b; --feld:#0c0c0c; --btn:#f2f2f2; --btnfg:#000; --rot:#ff5a5a;
          --mono:Consolas,"Cascadia Mono",monospace; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:"Segoe UI",system-ui,sans-serif; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
         background-image:radial-gradient(circle, rgba(255,255,255,.2) 0.8px, transparent 1.1px); background-size:7px 7px;
         -webkit-mask-image:linear-gradient(180deg,#000 0,transparent 220px); mask-image:linear-gradient(180deg,#000 0,transparent 220px); }
  form { position:relative; width:min(340px, 88vw); display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0 0 10px; font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.45em; text-align:center; }
  input { width:100%; background:var(--feld); border:1px solid var(--rand); color:var(--fg); border-radius:999px;
          padding:13px 20px; font-size:16px; outline:none; font-family:inherit; }
  input:focus { border-color:var(--dim); }
  button { background:var(--btn); color:var(--btnfg); border:0; border-radius:999px; padding:13px; cursor:pointer;
           font-family:var(--mono); font-size:12px; letter-spacing:.2em; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #fehler { min-height:18px; margin:0; text-align:center; font-size:13px; color:var(--rot); }
</style>
</head>
<body>
<form id="form">
  <h1>ATLAS</h1>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" autofocus>
  <button id="knopf">ANMELDEN</button>
  <p id="fehler"></p>
</form>
<script>
  const form = document.getElementById("form"), pw = document.getElementById("pw"),
        knopf = document.getElementById("knopf"), fehler = document.getElementById("fehler");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!pw.value) return;
    knopf.disabled = true; fehler.textContent = "";
    try {
      const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ passwort: pw.value }) });
      if (r.ok) { location.reload(); return; }
      const d = await r.json().catch(() => ({}));
      fehler.textContent = d.detail || "Anmeldung fehlgeschlagen.";
    } catch (err) { fehler.textContent = "Server nicht erreichbar."; }
    knopf.disabled = false; pw.select();
  });
</script>
</body>
</html>
